services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: grounded-doc-postgres
        restart: unless-stopped
        ports:
          - "5434:5432"
        environment:
          POSTGRES_DB: grounded_doc
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: zxcvbnmn

        volumes:
        - grounded_doc_pg_data:/var/lib/postgresql/data
        - ./init.sql:/docker-entrypoint-initdb.d/init.sql

        healthcheck:
          test: [ "CMD-SHELL", "pg_isready -U postgres -d grounded_doc" ]
          interval: 10s
          timeout: 5s
          retries: 5

volumes:
  grounded_doc_pg_data:
