services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: doc-reader-postgres
        restart: unless-stopped
        ports:
          - "5434:5432"
        environment:
          POSTGRES_DB: docReader
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: zxcvbnmn


        volumes:
        - docReader_pg_data:/var/lib/postgresql/data
        - ./init.sql:/docker-entrypoint-initdb.d/init.sql

        healthcheck:
          test: [ "CMD-SHELL", "pg_isready -U postgres -d docReader" ]
          interval: 10s
          timeout: 5s
          retries: 5


volumes:
  docReader_pg_data:
